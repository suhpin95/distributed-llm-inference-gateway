# Token-throughput based autoscaling (KEDA). Assumes KEDA and a Prometheus
# ServiceMonitor-compatible Prometheus are installed in the cluster.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: gateway
  endpoints:
    - port: metrics
      interval: 5s
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-tokens-per-second
spec:
  scaleTargetRef:
    name: worker
    kind: StatefulSet
  minReplicaCount: 2
  maxReplicaCount: 8
  pollingInterval: 10
  cooldownPeriod: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:80
        metricName: gateway_output_tokens_per_second
        query: sum(gateway_output_tokens_per_second)
        threshold: "40"
