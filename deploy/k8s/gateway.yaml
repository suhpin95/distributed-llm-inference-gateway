apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  WORKER_ADDRS: "worker-0.worker-headless.default.svc.cluster.local:9101,worker-1.worker-headless.default.svc.cluster.local:9101,worker-2.worker-headless.default.svc.cluster.local:9101"
  REDIS_ADDR: "redis.default.svc.cluster.local:6379"
  KAFKA_BROKERS: "kafka.default.svc.cluster.local:9092"
  KAFKA_TOPIC: "inference-requests"
  TENANT_RATE: "25"
  TENANT_BURST: "50"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: inference-gateway:latest
          imagePullPolicy: IfNotPresent
          args: ["/bin/gateway"]
          envFrom:
            - configMapRef:
                name: gateway-config
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
            - name: metrics
              containerPort: 9091
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
    - name: metrics
      port: 9091
      targetPort: metrics
