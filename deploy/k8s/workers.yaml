apiVersion: v1
kind: Service
metadata:
  name: worker-headless
spec:
  clusterIP: None
  selector:
    app: inference-worker
  ports:
    - name: grpc
      port: 9101
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worker
spec:
  serviceName: worker-headless
  replicas: 3
  selector:
    matchLabels:
      app: inference-worker
  template:
    metadata:
      labels:
        app: inference-worker
    spec:
      containers:
        - name: worker
          image: inference-worker:latest
          imagePullPolicy: IfNotPresent
          args: ["/bin/worker"]
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_GRPC_ADDR
              value: ":9101"
            - name: WORKER_MODEL
              value: "workhorse"
            - name: WORKER_MODE
              value: "mock"
            - name: WORKER_CAPACITY
              value: "8"
            - name: WORKER_TOKENS_PER_SEC
              value: "40"
          ports:
            - name: grpc
              containerPort: 9101
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
