syntax = "proto3";

package inference.v1;

option go_package = "github.com/example/distributed-llm-gateway/gen;gen";

// WorkerService is implemented by every backend: deterministic mock workers,
// llama.cpp worker agents, and (future) hosted/open-model adapters.
service WorkerService {
  rpc Generate(GenerateRequest) returns (stream GenerateResponse);
  rpc Stats(StatsRequest) returns (WorkerStats);
}

// GatewayService exposes the same streaming contract natively over gRPC.
service GatewayService {
  rpc Generate(GenerateRequest) returns (stream GenerateResponse);
}

message GenerateRequest {
  string request_id = 1;
  string tenant_id = 2;
  string model = 3;
  string prompt = 4;
  repeated string prefix_hashes = 5;
  int32 max_tokens = 6;
  float temperature = 7;
  string routing_policy = 8; // "smart" (default) or "round-robin" for A/B proof
}

message GenerateResponse {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    TOKEN = 1;
    DONE = 2;
    ERROR = 3;
  }

  Kind kind = 1;
  string token = 2;
  int32 tokens_generated = 3;
  int64 cached_tokens = 4;
  string worker_id = 5;
  string message = 6;
}

message StatsRequest {}

message WorkerStats {
  string worker_id = 1;
  string model = 2;
  int32 in_flight = 3;
  int32 queue_depth = 4;
  int32 capacity = 5;
  int64 cached_prefixes = 6;
  bool healthy = 7;
  double tokens_per_second = 8;
  int64 cache_hits = 9;
  int64 cache_misses = 10;
}
