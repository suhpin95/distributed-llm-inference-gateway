name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l cmd gen internal)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=5m

      - name: Test (race)
        run: go test -race ./... -count=1

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build gateway image
        run: docker build -f Dockerfile.gateway -t inference-gateway:ci .

      - name: Build worker image
        run: docker build -f Dockerfile.worker -t inference-worker:ci .
